{% extends "base.html" %}
{% block title %}Log in - Her Aura{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" action="/login" id="login-form" class="card form">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ email or '' }}" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required>
  <button type="submit" id="btn-login">Log in</button>
</form>
<p>New here? <a href="/register">Create an account</a></p>
{% endblock %}
